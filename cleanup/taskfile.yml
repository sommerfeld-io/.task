---
version: '3.42.1'

tasks:

  update:
    desc: Update project dependencies and submodules
    cmds:
      - git submodule update --remote

  filesystem:
    desc: Cleanup the filesystem for this project
    cmds:
      - sudo rm -rf .cache
      - rm -rf node_modules
      - sudo rm -rf target
      - rm -rf tests/compose/.vagrant
      # Ansible caches (also nested ones, e.g. in role submodules) are often created as root by
      # containers (e.g. ansible-lint), which would make the chmod commands below fail
      - sudo find . -type d -name .ansible -prune -exec rm -rf {} +
      - sudo rm -rf .devcontainer/ops
      - find . -type f -exec chmod ugo+r {} +
      - find . -type d -exec chmod 755 {} +
      - find . -name "*.sh" -type f -exec chmod +x {} +

  all:
    desc: Cleanup the whole development environment for this project
    cmds:
      - docker compose down --remove-orphans
      - docker container prune -f
      - docker volume prune -f
      - task: filesystem
      - task: update
